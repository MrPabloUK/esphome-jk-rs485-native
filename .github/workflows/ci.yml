name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: C++ parser / scheduler tests
        working-directory: tests/cpp
        run: make test
      - name: Config validation unit tests
        run: python3 tests/config/test_validation.py

  esphome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: pip install esphome
      - name: Validate example
        run: esphome config examples/esp32-jk-native-master.yaml
      - name: Compile two-pack example
        run: esphome compile examples/esp32-jk-native-master.yaml
      - name: Duplicate address must fail
        run: |
          set +e
          esphome config tests/config/invalid_duplicate.yaml
          test $? -ne 0
