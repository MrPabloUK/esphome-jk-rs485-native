substitutions:
  name: jk-native-master
  tx_pin: GPIO17
  rx_pin: GPIO16
  flow_control_pin: GPIO4

esphome:
  name: ${name}
  friendly_name: JK RS485 Native Master

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

api:
ota:
  - platform: esphome

wifi:
  ssid: "jk-native-ci"
  password: "jk-native-ci"

external_components:
  - source:
      type: local
      path: ../components
    components: [jk_rs485_native_master, jk_rs485_native_bms]

uart:
  id: uart_jk
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 115200
  rx_buffer_size: 512

jk_rs485_native_master:
  id: jk_bus
  uart_id: uart_jk
  flow_control_pin: ${flow_control_pin}
  response_timeout: 200ms
  inter_byte_timeout: 30ms
  offline_retry_interval: 5s
  min_command_gap: 150ms
  turnaround: 25ms
  debug_dump_frames: false
  poll:
    cell_info: 1s
    settings: 30s
    device_info: 1h

jk_rs485_native_bms:
  - id: bms1
    address: 0x01
    master_id: jk_bus
    protocol_version: JK02_32S
    cell_count: 16
  - id: bms2
    address: 0x02
    master_id: jk_bus
    protocol_version: JK02_32S
    cell_count: 16

sensor:
